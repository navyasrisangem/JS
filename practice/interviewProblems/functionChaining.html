<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let username = prompt("enter your name");
        function Validate(username) {
            // console.log(username);
            return {
                required: function () {
                    if (username === "") {
                        alert("username required");
                
                    }
                    return this;   //required function gets added into the memory of validate function.
                },
                minlength: function (val) {                    
                    if (username.length < val) {
                        console.log(username.length);
                        alert("name too short");
                        return;
                    } 
                    return this;    //minlength function gets added into the memory of validate function.
                },   
                print: function() {                   
                        document.write(username);
                  return this;
                }            
            }             
        }
        Validate(username).required().minlength(4).print();        
    </script>
</head>

</body>

</html>
