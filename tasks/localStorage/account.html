<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account</title>
    <script>
        function onbodyload() {
            if (!localStorage.getItem("username")) {
                location.href = "./local.html";
                return;
            }
            let userid1 = document.querySelector("p");
            userid1.innerHTML = localStorage.getItem("username");
            checkInactive();
        }
        function signout() {
            localStorage.removeItem("username");
            location.href = "./local.html";
        }
        function checkInactive() {
            var task;
            function signoutauto() {
                alert("Your session has ended");
                localStorage.removeItem('username');
                location.href = "./local.html";
            }
            function Active() {
                clearTimeout(task);
                task = setTimeout(signoutauto, 10000);
            }
            window.onload = Active;
            document.onkeypress = Active;
            document.onmousemove = Active;
            document.onscroll = Active;
            document.onkeydown = Active;
            document.onclick = Active;
            document.ontouchstart = Active;  //for mobile devices
        }        
    </script>
</head>
<body onload="onbodyload()">
    <h3>User account</h3>
    <p></p>
    <button onclick="signout()">signout</button>
</body>
</html>
