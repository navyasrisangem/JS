<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>Weather app</title>
    <style>
        .container-fluid {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .rect {
            width: 330px;
            height: 400px;
            background-color: aqua;
            padding: 20px;
        }

        .image {
            width: 110px;
            height: 110px;
        }
    </style>
    <script>
         function onBodyLoad() {
            let lat = document.getElementById("lat");
            let lon = document.getElementById("lon");
            let temperature = document.getElementById("temperature");
            let city = document.getElementById("city");
            let humidity = document.getElementById("humidity");
            let wind = document.getElementById("wind");
            
            navigator.geolocation.getCurrentPosition((position) => {
                const { latitude, longitude } = position.coords;
                lat.innerHTML = `Latitude: ${latitude}`;
                lon.innerHTML = `Longitude: ${longitude}`;
                
                const apikey = "bc464ef9370066684fba722fe0486755";
                fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${latitude}&lon=${longitude}&appid=${apikey}&units=metric`)
                    .then(response => response.json())
                    .then(data => {
                        temperature.innerHTML = `${data.main.temp}°C`;
                        city.innerHTML = `${data.name}`;
                        humidity.innerHTML = `${data.main.humidity}%`;
                        wind.innerHTML = `${data.wind.speed}m/s`;
                    })
            })
        }
    </script>
</head>

<body onload="onBodyLoad()">
    <div class="container-fluid">
        <div class="rect rounded shadow">
            <p id="lat"></p>
            <p id="lon"></p>
            <div class="weatherDetails text-center m-4">
                <img src="cloudy.png" class="image" />
                <h4 id="temperature"></h4>
                <h3 id="city"></h3>
            </div>
            <div class="d-flex justify-content-between">
                <div class="d-flex">
                    <i class="bi bi-droplet-half fs-2 m-2"></i>
                    <div>
                        <div>Humidity</div>
                        <h4 id="humidity"></h4>
                    </div>
                </div>
                <div class="d-flex">
                    <i class="bi bi-wind fs-2 m-2"></i>
                    <div>
                        <div>Wind speed</div>
                        <h4 id="wind"></h4>
                    </div>
                </div>
            </div>
        </div>
    </div>
    </div>
</body>

</html>
