<script>
    let _items = new WeakMap();
    class Queue {
        constructor() {
            _items.set(this, []);
        }
        shift(element) {
            let items = _items.get(this);
            items.unshift(element);
        }
        pop() {
            let items = _items.get(this);
            return items.shift();
        }
        peek() {
            let items = _items.get(this);
            return items[0];
        }
        clear() {
            let items = _items.get(this);
            items.length = 0;
        }
        isEmpty() {
            let items = _items.get(this);
            return items.length === 0;
        }
        size() {
            let items = _items.get(this);
            return items.length;
        }
        print() {
            let items = _items.get(this);
            console.log(items.toString());
        }
    }
    let obj = new Queue();
    obj.shift("A");
    obj.shift("B");
    obj.shift("C");
    obj.print();
    console.log(obj.pop());
    console.log(obj.peek());
    obj.clear();
    console.log(obj.isEmpty());
    console.log(obj.size());
    console.log(obj.items);
</script>
